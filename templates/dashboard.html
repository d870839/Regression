<!DOCTYPE html>
<html>
<head>
  <title>Pricing Impact Dashboard</title>
</head>
<body>
  <h1>Simulate Price Changes</h1>
  <label for="item">Select item:</label>
  <select id="item">
    {% for item in items %}
      <option value="{{ item }}">{{ item }}</option>
    {% endfor %}
  </select>

  <label for="price">New Price:</label>
  <input type="number" id="price" value="1.00" step="0.01">
  <button onclick="simulate()">Simulate</button>

  <div id="results"></div>

  <script>
    function simulate() {
      const item = document.getElementById('item').value;
      const price = document.getElementById('price').value;

      fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item, price })
      })
      .then(res => res.json())
      .then(data => {
        let html = "<h2>Predicted Sales Changes</h2><ul>";
        data.forEach(d => {
          html += `<li>${d.sales_item}: ${d.predicted_change.toFixed(2)} units</li>`;
        });
        html += "</ul>";
        document.getElementById('results').innerHTML = html;
      });
    }
  </script>
</body>
</html>
